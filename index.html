<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florida Web Map</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://js.arcgis.com/5.1/"></script>
</head>
<body>

    <!-- PASSWORD OVERLAY -->
    <div id="passwordOverlay">
        <div class="password-box">
            <h2>🔒 Protected Map</h2>
            <p>Please enter the password to access the map.</p>
            <input type="password" id="passwordInput" placeholder="Enter password..." autocomplete="off" />
            <button id="passwordSubmit">Unlock Map</button>
            <div id="passwordError" class="error-text"></div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="mainApp" style="display: none;">
        <header>
            <h2>Florida Web Map</h2>
        </header>

        <div class="dashboard">
            <aside class="layers-panel">
                <div class="search-panel">
                    <div class="search-tabs">
                        <button class="search-tab active" data-tab="address">Address</button>
                        <button class="search-tab" data-tab="parcel">Parcel #</button>
                    </div>

                    <div class="search-body" id="tab-address">
                        <input type="text" id="addressInput" placeholder="e.g. 100 N Main St, Miami, FL" autocomplete="off" />
                        <button id="addressBtn" class="search-go">Search</button>
                    </div>

                    <div class="search-body hidden" id="tab-parcel">
                        <input type="text" id="parcelInput" placeholder="e.g. 282229498000010" autocomplete="off" />
                        <button id="parcelBtn" class="search-go">Search</button>
                    </div>

                    <div id="searchStatus" class="search-status"></div>
                </div>

                <div class="panel-header">
                    <h3>Contents</h3>
                    <span id="layerCount">0 Layers</span>
                </div>

                <div class="panel-tools">
                    <input type="text" id="searchLayer" placeholder="Filter layers..." />
                </div>

                <div id="layersList">
                    <p class="loading">Loading layers...</p>
                </div>
            </aside>

            <main>
                <div id="viewDiv"></div>
            </main>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
