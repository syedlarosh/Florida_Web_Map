
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ArcGIS GIS Dashboard</title>

    <link rel="stylesheet"
    href="https://js.arcgis.com/5.1/esri/themes/light/main.css">

    <link rel="stylesheet" href="style.css">

    <script type="module" src="https://js.arcgis.com/5.1/"></script>
</head>

<body>

    <header>
        <h2>Florida Web Map</h2>
    </header>

    <div class="dashboard">

        <!-- Layers Panel -->
        <aside class="layers-panel">

            <div class="panel-header">
                <h3>Contents</h3>
                <span id="layerCount">0 Layers</span>
            </div>

            <div class="panel-tools">
                <input
                    type="text"
                    id="searchLayer"
                    placeholder="Search layers..."
                >
            </div>

            <div id="layersList">
                <p class="loading">Loading layers...</p>
            </div>

        </aside>

        <!-- Map -->
        <main>
            <div id="viewDiv"></div>
        </main>

    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
