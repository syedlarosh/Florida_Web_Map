<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florida GIS Dashboard</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://js.arcgis.com/5.1/"></script>
</head>
<body>

    <!-- PASSWORD OVERLAY (Modern Glassmorphism) -->
    <div id="passwordOverlay">
        <div class="password-box">
            <div class="lock-icon">🔒</div>
            <h2>Secure Access</h2>
            <p>Please enter the password to access the GIS Dashboard.</p>
            
            <div class="input-wrapper">
                <input type="password" id="passwordInput" placeholder="Enter password..." autocomplete="off" />
                <button type="button" id="togglePassword" class="eye-btn" title="Show/Hide Password">
                    <svg id="eyeIcon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <div class="remember-row">
                <input type="checkbox" id="rememberMe" />
                <label for="rememberMe">Remember this device</label>
            </div>

            <button id="passwordSubmit">Unlock Map</button>
            <div id="passwordError" class="error-text"></div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="mainApp" style="display: none;">
        
        <!-- MODERN FLOATING PANEL -->
        <aside class="floating-panel">
            
            <div class="panel-header-brand">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg>
                <h2>Florida GIS</h2>
            </div>

            <!-- Search Section -->
            <div class="search-panel">
                <div class="search-tabs">
                    <button class="search-tab active" data-tab="address">Search Address</button>
                    <button class="search-tab" data-tab="parcel">Search Parcel</button>
                </div>

                <div class="search-body" id="tab-address">
                    <div class="input-group">
                        <input type="text" id="addressInput" placeholder="e.g. 100 N Main St, Miami" autocomplete="off" />
                        <button id="addressBtn" class="primary-btn">Search</button>
                    </div>
                </div>

                <div class="search-body hidden" id="tab-parcel">
                    <div class="input-group">
                        <input type="text" id="parcelInput" placeholder="e.g. 282229498000010" autocomplete="off" />
                        <button id="parcelBtn" class="primary-btn">Search</button>
                    </div>
                </div>

                <div id="searchStatus" class="search-status"></div>
            </div>

            <!-- Layers Section -->
            <div class="layers-section">
                <div class="layers-header">
                    <h3>Map Layers</h3>
                    <span id="layerCount" class="badge">0</span>
                </div>
                
                <div class="panel-tools">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchLayer" placeholder="Filter layers..." />
                </div>

                <div id="layersList" class="layers-list">
                    <p class="loading">Loading layers...</p>
                </div>
            </div>
        </aside>

        <!-- MAP -->
        <main>
            <div id="viewDiv"></div>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
